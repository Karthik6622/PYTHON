[server]
headless = true
maxUploadSize = 5

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#FFE600"
backgroundColor = "#08080B"
secondaryBackgroundColor = "#111116"
textColor = "#EDEBDD"
linkColor = "#FFE600"
borderColor = "#3D3811"
codeBackgroundColor = "#0B0B0F"
baseRadius = "2px"
buttonRadius = "2px"
font = "sans serif"
codeFont = "monospace"
# Semantic colours used by badges (:green-badge[...] etc.): neon variants of a yellow-based cyberpunk palette.
redColor = "#FF2E63"
orangeColor = "#FFA21F"
yellowColor = "#FFE600"
greenColor = "#39FF88"
blueColor = "#00E5FF"
violetColor = "#B388FF"
grayColor = "#8D8A72"
