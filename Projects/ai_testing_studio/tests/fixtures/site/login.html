<!doctype html>
<html lang="en">
<head><title>Acme Shop - Sign in</title></head>
<body>
<header>
  <nav aria-label="Main">
    <a href="/index.html">Home</a>
    <a href="/products.html">Products</a>
    <a href="/contact.html">Contact</a>
    <a href="/admin/secret.html">Admin</a>
  </nav>
</header>
<main>
  <h1>Sign in</h1>
  <form id="login-form" action="/index.html" method="post">
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" required placeholder="you@example.com">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required>
    <label><input type="checkbox" name="remember"> Remember me</label>
    <select name="role" aria-label="Role"><option>Customer</option><option>Seller</option></select>
    <button type="submit" data-testid="login-submit">Sign in</button>
  </form>
  <a href="/forgot.html">Forgot password?</a>
  <a href="https://external.invalid/page">External</a>
</main>
</body>
</html>
